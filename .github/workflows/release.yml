name: Release

# Obsidian 社区目录靠 GitHub Release 的 tag 定位安装资源，且要求 tag 与
# manifest.json 的 version 【逐字符相同】—— 是 1.0.0 而不是 v1.0.0。
# 因此这里只匹配以数字开头的 tag，带 v 前缀的 tag 对 Obsidian 而言等于不存在。
on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 硬性把关：tag 与 manifest.version 必须完全一致。
      # 这是 Obsidian 识别发布版本的唯一依据，写错等于没发布。
      - name: 校对 tag 与 manifest.version 完全一致
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "tag=$TAG  manifest.version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG 与 manifest.json 的 version $VERSION 不一致"
            echo "::error::Obsidian 要求两者完全相同且不带 v 前缀，否则社区目录无法识别该发布版本"
            exit 1
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范
        run: npm run lint

      - name: 单元与集成测试
        run: npm test

      - name: 打包
        run: npm run build

      - name: 产物级验证（真实加载 main.js 并打 HTTP 请求）
        run: npm run verify

      - name: 创建 Release 并上传插件资产
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          # Obsidian 安装插件时会下载这三个文件，缺一不可
          files: |
            main.js
            manifest.json
            styles.css
