name: Release

# Obsidian 社区目录靠 GitHub Release 的 tag 定位安装资源，且要求 tag 与
# manifest.json 的 version 【逐字符相同】—— 是 1.0.0 而不是 v1.0.0。
# 因此这里只匹配以数字开头的 tag，带 v 前缀的 tag 对 Obsidian 而言等于不存在。
on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write        # 创建 Release 并上传资产
  id-token: write        # 生成来源证明需要 OIDC token
  attestations: write    # 允许写入构建来源证明

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 硬性把关：tag 与 manifest.version 必须完全一致。
      # 这是 Obsidian 识别发布版本的唯一依据，写错等于没发布。
      - name: 校对 tag 与 manifest.version 完全一致
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "tag=$TAG  manifest.version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG 与 manifest.json 的 version $VERSION 不一致"
            echo "::error::Obsidian 要求两者完全相同且不带 v 前缀，否则社区目录无法识别该发布版本"
            exit 1
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范
        run: npm run lint

      - name: 单元与集成测试
        run: npm test

      - name: 打包
        run: npm run build

      - name: 产物级验证（真实加载 main.js 并打 HTTP 请求）
        run: npm run verify

      # 为发布资产生成构建来源证明：任何人都可以用
      #   gh attestation verify main.js --repo YaYII/obsidian-vault-bridge
      # 核验这些文件确实由本仓库的这次 workflow 构建，而非事后被替换。
      # 顺带一提，本项目的构建是可复现的（无时间戳/随机量，连续构建哈希一致），
      # 因此用户不仅能验证来源，还能自行重建出逐字节相同的文件。
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: 创建 Release 并上传插件资产
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          # Obsidian 安装插件时会下载这三个文件，缺一不可
          files: |
            main.js
            manifest.json
            styles.css

      # 把赞助二维码放在 Release 说明【最前面】——这是访问者第一眼看到的位置。
      # 为什么不用 action 的 append_body：实测它与 generate_release_notes 同时使用会【被静默忽略】，
      # 生成的说明里只剩一行 Full Changelog。显式读写 body 是确定的：读回 → 前置 → 写回。
      - name: 在 Release 说明前插入赞助二维码
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/generated-body.md
          cat > /tmp/release-body.md <<'SPONSOR'
          ## 赞助 / Sponsor

          Vault Bridge 是业余时间的作品。如果它让你在手机和电脑之间传文件省了事，
          欢迎扫码支持 —— **完全自愿，不影响任何功能**。

          <table>
            <tr>
              <td align="center">
                <img src="https://raw.githubusercontent.com/YaYII/obsidian-vault-bridge/master/docs/sponsor/wechat-pay.jpg" width="240" alt="微信支付收款码" />
                <br /><b>微信支付</b>
              </td>
              <td align="center">
                <img src="https://raw.githubusercontent.com/YaYII/obsidian-vault-bridge/master/docs/sponsor/alipay.jpg" width="240" alt="支付宝收款码" />
                <br /><b>支付宝</b>
              </td>
            </tr>
          </table>

          不花钱也能帮上忙：给仓库点个 Star、在社区插件目录里点个赞、或把遇到的问题反馈过来。
          SPONSOR
          # GitHub 自动生成的变更说明接在赞助段落之后
          printf '\n---\n\n' >> /tmp/release-body.md
          cat /tmp/generated-body.md >> /tmp/release-body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-body.md
