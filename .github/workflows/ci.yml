name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 覆盖 Obsidian 插件常用的 Node 版本下限与当前 LTS
        node-version: ['18', '20']
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 产物级验证
        run: npm run verify
